[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "duplicleaner"
version = "0.1.0"
description = "NAS duplicate file cleanup and photo organization tool"
readme = "README.md"
license = {text = "BSL-1.1"}
authors = [
    {name = "Clinton Campbell", email = "clinton@xrmech.com"}
]
maintainers = [
    {name = "Clinton Campbell", email = "clinton@xrmech.com"}
]
keywords = ["duplicate", "files", "nas", "photos", "organization", "deduplication"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: Other/Proprietary License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Filesystems",
    "Topic :: Multimedia :: Graphics",
]
requires-python = ">=3.11"
dependencies = [
    "dearpygui>=1.11.0",
    "pillow>=10.0.0",
    "imagehash>=4.3.0",
    "xxhash>=3.4.0",
    "exifread>=3.0.0",
    "python-dateutil>=2.8.0",
    "geopy>=2.4.0",
    "send2trash>=1.8.0",
    "gitpython>=3.1.0",
]

[project.optional-dependencies]
ai = [
    "insightface>=0.7.0",
    "onnxruntime-gpu>=1.16.0",
    "open-clip-torch>=2.20.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "ultralytics>=8.0.0",
    "easyocr>=1.7.0",
    "scikit-learn>=1.3.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.6.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
]

[project.urls]
Homepage = "https://github.com/xrmech/duplicleaner"
Documentation = "https://github.com/xrmech/duplicleaner#readme"
Repository = "https://github.com/xrmech/duplicleaner"
Issues = "https://github.com/xrmech/duplicleaner/issues"

[project.scripts]
duplicleaner = "duplicleaner.__main__:main"

[project.gui-scripts]
duplicleaner-gui = "duplicleaner.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
duplicleaner = ["resources/*", "db/*.sql"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "dearpygui.*",
    "imagehash.*",
    "xxhash.*",
    "exifread.*",
    "insightface.*",
    "cv2.*",
    "clip.*",
    "ultralytics.*",
    "easyocr.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
]

[tool.ruff.lint.isort]
known-first-party = ["duplicleaner"]

[tool.ruff.lint.per-file-ignores]
"src/duplicleaner/app.py" = ["ARG002", "ARG005"]
"src/duplicleaner/ui/*.py" = ["ARG002", "ARG005"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "error::DeprecationWarning:duplicleaner\\..*",
]
markers = [
    "unit: fast, isolated tests",
    "integration: multi-module tests",
    "slow: long-running tests",
    "requires_imagehash: depends on imagehash being installed",
    "requires_geopy: depends on geopy being installed",
    "requires_dearpygui: depends on Dear PyGui being installed",
    "requires_easyocr: depends on EasyOCR being installed",
    "requires_cv2: depends on OpenCV being installed",
]
